services:
  postgres:
    image: postgres:17-alpine
    container_name: petroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: petroute
      POSTGRES_USER: petroute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petroute_dev}
    ports:
      - "5432:5432"
    volumes:
      - petroute-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petroute -d petroute"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  petroute-postgres-data:
